[project]
name = "mca-validation-mcp"
version = "1.0.0"
description = "FastAPI & FastMCP Statutory MCA AOC-4 XBRL Validation Engine for Claude & Accountants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "mcp>=1.0.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
mca-validator = "app.main:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
